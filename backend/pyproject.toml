[project]
name = "ai-self-media"
version = "0.1.0"
description = "AI-powered self-media content generation and publishing platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "deepagents>=0.3.5,<0.4.0",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Browser automation
    "playwright>=1.48",
    # AI / Search tools
    "tavily-python>=0.5",
    "dashscope>=1.20",
    # Utilities
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "httpx>=0.27",
    # Redis
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
