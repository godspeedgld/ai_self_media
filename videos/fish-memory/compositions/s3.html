<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "HFZh"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        #root { position: absolute; inset: 0; font-family: "HFZh", "Noto Sans JP", sans-serif; background: #061523; }
        #s3-tank-g { position: absolute; inset: 0; }
        #s3-tank { position: absolute; left: 610px; top: 240px; width: 700px; height: 560px; border: 6px solid rgba(160,215,235,0.75); border-radius: 26px; background: rgba(20,60,90,0.35); overflow: hidden; }
        #s3-water { position: absolute; left: 0; right: 0; top: 90px; bottom: 0; background: rgba(24,90,130,0.55); }
        #s3-surface { position: absolute; left: 0; right: 0; top: 88px; height: 5px; background: rgba(120,210,235,0.9); border-radius: 3px; }
        #s3-fish { position: absolute; left: 180px; top: 380px; width: 150px; height: 75px; }
        .s3-pellet { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #FFB454; }
        #s3-person { position: absolute; left: 120px; top: 420px; width: 140px; height: 300px; }
        #s3-label { position: absolute; left: 1100px; top: 300px; color: #FFB454; font-size: 44px; font-weight: 700; }
        .s3-bub { position: absolute; border-radius: 50%; border: 2px solid rgba(62,207,224,0.4); }
      </style>
      <div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
        <div class="clip" id="s3-tank-clip" data-start="0.1" data-duration="11.7" data-track-index="0">
          <div id="s3-tank-g">
            <div id="s3-tank">
              <div id="s3-water"></div>
              <div id="s3-surface"></div>
              <div id="s3-fish">
                <svg viewBox="0 0 120 60" width="150" height="75">
                  <ellipse cx="48" cy="30" rx="34" ry="18" fill="#3ECFE0"/>
                  <polygon points="80,30 110,12 104,30 110,48" fill="#2AB5C7"/>
                  <circle cx="28" cy="25" r="4.5" fill="#061523"/>
                </svg>
              </div>
              <div class="s3-pellet" id="s3-p1" style="left:300px; top:110px;"></div>
              <div class="s3-pellet" id="s3-p2" style="left:380px; top:105px;"></div>
              <div class="s3-pellet" id="s3-p3" style="left:250px; top:112px;"></div>
            </div>
            <div id="s3-label" data-var-text="s3label" style="opacity:0;">鱼冲上来 = 它记得</div>
          </div>
        </div>
        <div class="clip" id="s3-person-clip" data-start="7.6" data-duration="4.2" data-track-index="1">
          <div id="s3-person">
            <svg viewBox="0 0 100 200" width="140" height="280">
              <circle cx="50" cy="30" r="26" fill="#8FB8CC"/>
              <path d="M20 200 q0 -120 30 -120 q30 0 30 120" fill="#8FB8CC"/>
            </svg>
          </div>
        </div>
        <div class="clip" id="s3-bub-clip" data-start="0" data-duration="11.8" data-track-index="2" data-layout-ignore>
          <div class="s3-bub" id="s3-b1" style="left:700px; top:1000px; width:26px; height:26px;"></div>
          <div class="s3-bub" id="s3-b2" style="left:1240px; top:1040px; width:20px; height:20px;"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // 鱼缸淡入升起
        tl.fromTo("#s3-tank-g", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        // 水面轻微晃动
        tl.fromTo("#s3-surface", { x: 0 }, { x: 10, duration: 5.9, ease: "sine.inOut" }, 0);
        tl.to("#s3-surface", { x: 0, duration: 5.9, ease: "sine.inOut" }, 5.9);
        // 喂食：颗粒落下（~5.5s 处旁白"喂食"）
        tl.fromTo("#s3-p1", { y: 0, opacity: 0 }, { opacity: 1, y: 130, duration: 1.1, ease: "power1.in" }, 5.4);
        tl.fromTo("#s3-p2", { y: 0, opacity: 0 }, { opacity: 1, y: 150, duration: 1.2, ease: "power1.in" }, 5.8);
        tl.fromTo("#s3-p3", { y: 0, opacity: 0 }, { opacity: 1, y: 120, duration: 1.0, ease: "power1.in" }, 6.2);
        // 人走近（7.9–10.0）
        tl.fromTo("#s3-person", { x: -140, opacity: 0 }, { x: 210, opacity: 1, duration: 2.1, ease: "power1.inOut" }, 7.88);
        // 鱼从缸底冲上水面（10.0–11.3）
        tl.fromTo("#s3-fish", { y: 0, rotation: 0 }, { y: -300, duration: 1.15, ease: "power2.out" }, 10.02);
        tl.to("#s3-fish", { scaleX: 0.88, scaleY: 1.14, duration: 0.25, ease: "power1.out" }, 10.02);
        tl.to("#s3-fish", { scaleX: 1, scaleY: 1, duration: 0.3, ease: "power1.in" }, 10.3);
        // 颗粒被吃掉
        tl.to(["#s3-p1", "#s3-p2", "#s3-p3"], { opacity: 0, duration: 0.25, ease: "power1.in" }, 11.0);
        // 标签弹出（延长驻留：10.0 → 场景末）
        tl.fromTo("#s3-label", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 10.0);
        // 缸内气泡
        tl.fromTo("#s3-b1", { y: 0 }, { y: -1100, duration: 11.8, ease: "none" }, 0);
        tl.fromTo("#s3-b2", { y: 0 }, { y: -1140, duration: 11.8, ease: "none" }, 0);
        window.__timelines["s3"] = tl;
      </script>
    </template>
  </body>
</html>
