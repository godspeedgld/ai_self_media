      <div id="root" data-composition-id="s4" data-width="1920" data-height="1080">

        <div class="clip" id="s4-pro-clip" data-start="0.15" data-duration="9.39" data-track-index="0">
          <div class="card" id="s4-pro">

            <div>
              <span class="tag" id="s4-t1">过滤</span>

              <line id="s4-x2" x1="92" y1="8" x2="8" y2="92" stroke="#FF5A5F" stroke-width="9" stroke-linecap="round"/>

        <div class="clip" id="s4-bub-clip" data-start="0" data-duration="9.54" data-track-index="2" data-layout-ignore>

        // "过滤/换水/换气" 逐个弹出 (旁白 21.7 输出 = 3.36 本地)

        tl.fromTo("#s4-t3", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 3.8);

        tl.fromTo("#s4-x1", { attr: { "stroke-dashoffset": 120 }, strokeDasharray: 120 }, { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.out" }, 4.25);

        tl.to("#s4-mine", { scale: 1, duration: 0.22, ease: "power2.inOut" }, 6.72);
        // "每次靠近它" (7.25–9.54) 鱼朝观察者方向动
        tl.to("#s4-mine-fish", { x: 26, duration: 0.6, ease: "sine.inOut" }, 7.3);
        tl.to("#s4-mine-fish", { x: -8, duration: 0.6, ease: "sine.inOut" }, 7.9);
        tl.to("#s4-mine-fish", { x: 0, duration: 0.5, ease: "sine.inOut" }, 8.5);

        tl.fromTo("#s4-b1", { y: 0 }, { y: -1120, duration: 9.54, ease: "none" }, 0);
        tl.fromTo("#s4-b2", { y: 0 }, { y: -1160, duration: 9.54, ease: "none" }, 0);
