<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "HFZh"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        #root { position: absolute; inset: 0; font-family: "HFZh", "Noto Sans JP", sans-serif; background: #061523; }
        .bubble { position: absolute; border-radius: 50%; border: 2px solid rgba(62,207,224,0.5); }
      </style>
      <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
        <!-- 背景游过的大鱼 -->
        <div class="clip" id="s1-fish-clip" data-start="0" data-duration="2.32" data-track-index="0">
          <div id="s1-fish-wrap" style="position:absolute; left:0; top:560px; width:420px; height:210px; opacity:0.35;">
            <svg viewBox="0 0 120 60" width="420" height="210">
              <ellipse cx="48" cy="30" rx="34" ry="18" fill="#3ECFE0"/>
              <polygon points="80,30 110,12 104,30 110,48" fill="#2AB5C7"/>
              <circle cx="28" cy="25" r="4.5" fill="#061523"/>
              <path d="M38 38 q10 7 22 0" stroke="#0AA3B5" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <!-- 气泡 -->
        <div class="clip" id="s1-bub-clip" data-start="0" data-duration="2.32" data-track-index="1" data-layout-ignore>
          <div class="bubble" id="s1-b1" style="left:300px; top:900px; width:34px; height:34px;"></div>
          <div class="bubble" id="s1-b2" style="left:880px; top:1000px; width:22px; height:22px;"></div>
          <div class="bubble" id="s1-b3" style="left:1480px; top:940px; width:28px; height:28px;"></div>
        </div>
        <!-- 标题 -->
        <div class="clip" id="s1-title-clip" data-start="0.05" data-duration="2.2" data-track-index="2">
          <div id="s1-title-wrap" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
            <h1 id="s1-title" style="color:#ECF6FF; font-size:120px; font-weight:900; letter-spacing:0.06em;">今天，来讲讲<span style="color:#3ECFE0;">鱼</span></h1>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const D = 2.32;
        // 大鱼从右往左游过，带一点上下起伏（首帧即在画面内）
        tl.fromTo("#s1-fish-wrap", { x: 1480 }, { x: -520, duration: D, ease: "none" }, 0);
        tl.to("#s1-fish-wrap", { y: -36, duration: D * 0.4, ease: "sine.inOut" }, 0);
        tl.to("#s1-fish-wrap", { y: 24, duration: D * 0.35, ease: "sine.inOut" }, D * 0.4);
        tl.to("#s1-fish-wrap", { y: 0, duration: D * 0.25, ease: "sine.inOut" }, D * 0.75);
        // 气泡上升
        tl.fromTo("#s1-b1", { y: 0 }, { y: -980, duration: D, ease: "none" }, 0);
        tl.fromTo("#s1-b2", { y: 0 }, { y: -1080, duration: D, ease: "none" }, 0);
        tl.fromTo("#s1-b3", { y: 0 }, { y: -1020, duration: D, ease: "none" }, 0);
        // 标题浮现（首帧已有微弱可见度）
        tl.fromTo("#s1-title", { opacity: 0.25, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.02);
        tl.fromTo("#s1-title", { scale: 0.92 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 0.08);
        window.__timelines["s1"] = tl;
      </script>
    </template>
  </body>
</html>
