    <div id="cg0" class="clip cap" data-start="0.03" data-duration="0.49" data-track-index="0"><span class="ct">今天</span></div>
    <div id="cg1" class="clip cap" data-start="0.52" data-duration="1.72" data-track-index="0"><span class="ct">我们来讲讲鱼,</span></div>
    <div id="cg2" class="clip cap" data-start="2.24" data-duration="1.13" data-track-index="0"><span class="ct">我们都说鱼有七秒的</span></div>
    <div id="cg3" class="clip cap" data-start="3.37" data-duration="0.66" data-track-index="0"><span class="ct">记忆,</span></div>
    <div id="cg4" class="clip cap" data-start="4.03" data-duration="1.12" data-track-index="0"><span class="ct">鱼真的有七秒记忆吗?</span></div>
    <div id="cg5" class="clip cap" data-start="5.15" data-duration="0.85" data-track-index="0"><span class="ct">不知道,</span></div>
    <div id="cg6" class="clip cap" data-start="6" data-duration="2.23" data-track-index="0"><span class="ct">但是养了鱼,</span></div>
    <div id="cg7" class="clip cap" data-start="8.23" data-duration="1.25" data-track-index="0"><span class="ct">养了鱼之后发现这个</span></div>
    <div id="cg8" class="clip cap" data-start="9.48" data-duration="1.70" data-track-index="0"><span class="ct">鱼啊</span></div>
    <div id="cg9" class="clip cap" data-start="11.19" data-duration="0.55" data-track-index="0"><span class="ct">时间,</span></div>
    <div id="cg10" class="clip cap" data-start="11.74" data-duration="1.93" data-track-index="0"><span class="ct">我养鱼喂食喂多了</span></div>
    <div id="cg11" class="clip cap" data-start="13.67" data-duration="0.67" data-track-index="0"><span class="ct">之后,</span></div>
    <div id="cg12" class="clip cap" data-start="14.34" data-duration="2.14" data-track-index="0"><span class="ct">每次我靠近鱼缸,</span></div>
    <div id="cg13" class="clip cap" data-start="16.48" data-duration="1.78" data-track-index="0"><span class="ct">鱼又会跑过来</span></div>
    <div id="cg14" class="clip cap" data-start="18.26" data-duration="0.94" data-track-index="0"><span class="ct">因为我们养的那个</span></div>
    <div id="cg15" class="clip cap" data-start="19.2" data-duration="0.50" data-track-index="0"><span class="ct">鱼</span></div>
    <div id="cg16" class="clip cap" data-start="19.7" data-duration="1.70" data-track-index="0"><span class="ct">缸不是那种专业鱼缸</span></div>
    <div id="cg17" class="clip cap" data-start="21.4" data-duration="0.30" data-track-index="0"><span class="ct">嘛,</span></div>
    <div id="cg18" class="clip cap" data-start="21.62" data-duration="1.06" data-track-index="0"><span class="ct">还要换水换气没有,</span></div>
    <div id="cg19" class="clip cap" data-start="22.68" data-duration="0.49" data-track-index="0"><span class="ct">我们就是搞了个</span></div>
    <div id="cg20" class="clip cap" data-start="23.17" data-duration="0.42" data-track-index="0"><span class="ct">缸子,</span></div>
    <div id="cg21" class="clip cap" data-start="23.59" data-duration="1.21" data-track-index="0"><span class="ct">然后养了条鱼,</span></div>
    <div id="cg22" class="clip cap" data-start="24.8" data-duration="0.71" data-track-index="0"><span class="ct">对不对?</span></div>
    <div id="cg23" class="clip cap" data-start="25.51" data-duration="1.35" data-track-index="0"><span class="ct">然后我们发现每次靠</span></div>
    <div id="cg24" class="clip cap" data-start="26.86" data-duration="0.94" data-track-index="0"><span class="ct">近它的时候,</span></div>
    <div id="cg25" class="clip cap" data-start="27.8" data-duration="1.20" data-track-index="0"><span class="ct">它的那个小鱼就</span></div>

    <div id="cg27" class="clip cap" data-start="30.2" data-duration="1.25" data-track-index="0"><span class="ct">可能在缸子底下</span></div>
    <div id="cg28" class="clip cap" data-start="31.45" data-duration="0.91" data-track-index="0"><span class="ct">就跑上来了,</span></div>

    <div id="cg35" class="clip cap" data-start="38.99" data-duration="1.42" data-track-index="0"><span class="ct">它能竖得起来,</span></div>
    <div id="cg36" class="clip cap" data-start="40.41" data-duration="0.48" data-track-index="0"><span class="ct">哇,</span></div>
    <div id="cg37" class="clip cap" data-start="40.89" data-duration="1.03" data-track-index="0"><span class="ct">那在水面上一张</span></div>
    <div id="cg38" class="clip cap" data-start="41.92" data-duration="1.23" data-track-index="0"><span class="ct">一只因为我们喂食的时候</span></div>
    <div id="cg39" class="clip cap" data-start="43.15" data-duration="1.46" data-track-index="0"><span class="ct">都是从鱼缸顶上</span></div>
    <div id="cg40" class="clip cap" data-start="44.61" data-duration="2.12" data-track-index="0"><span class="ct">去喂食的嘛所以</span></div>
    <div id="cg41" class="clip cap" data-start="46.73" data-duration="1.45" data-track-index="0"><span class="ct">如果鱼真的只有七秒</span></div>
    <div id="cg42" class="clip cap" data-start="48.18" data-duration="1.30" data-track-index="0"><span class="ct">的记忆,</span></div>
    <div id="cg43" class="clip cap" data-start="49.48" data-duration="1.62" data-track-index="0"><span class="ct">它怎么能记住鱼食是</span></div>
    <div id="cg44" class="clip cap" data-start="51.1" data-duration="1.14" data-track-index="0"><span class="ct">从上面来的呢?</span></div>
    <div id="cg45" class="clip cap" data-start="52.24" data-duration="1.11" data-track-index="0"><span class="ct">也就是说它刚吃完这个</span></div>
    <div id="cg46" class="clip cap" data-start="53.35" data-duration="1.10" data-track-index="0"><span class="ct">鱼食之后,</span></div>
    <div id="cg47" class="clip cap" data-start="54.45" data-duration="1.22" data-track-index="0"><span class="ct">估计七秒之后,</span></div>
    <div id="cg48" class="clip cap" data-start="55.67" data-duration="0.99" data-track-index="0"><span class="ct">它就忘了鱼食从</span></div>
    <div id="cg49" class="clip cap" data-start="56.66" data-duration="1.38" data-track-index="0"><span class="ct">哪里来了所以鱼只有</span></div>
    <div id="cg50" class="clip cap" data-start="58.04" data-duration="1.49" data-track-index="0"><span class="ct">七秒这个记忆,</span></div>
    <div id="cg51" class="clip cap" data-start="59.53" data-duration="1.60" data-track-index="0"><span class="ct">我觉得这个应该是</span></div>
    <div id="cg52" class="clip cap" data-start="61.13" data-duration="1.28" data-track-index="0"><span class="ct">个谣言,</span></div>
    <div id="cg53" class="clip cap" data-start="62.41" data-duration="0.51" data-track-index="0"><span class="ct">应该</span></div>
    <div id="cg54" class="clip cap" data-start="62.92" data-duration="1.41" data-track-index="0"><span class="ct">不对的至少我们养的</span></div>
